name: dotnet-CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Prescriptions.Api.sln

      - name: Build
        run: dotnet build Prescriptions.Api.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Prescriptions.Api.sln --configuration Release --no-build
